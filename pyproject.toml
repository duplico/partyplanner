[project]
name = "partyplanner"
version = "0.1.0"
description = "Config-first, serverless invitation sites: one occasion, many events, capability-URL invitations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "defusedcsv>=2.0",
    "icalendar>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "pydantic>=2.5",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
partyplanner = "partyplanner.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.34",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partyplanner"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "lambda"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
