# Reusable workflow: retire an occasion. Exports a final RSVP snapshot as an
# artifact, then destroys the capsule's infrastructure. Intended to be called
# from a manually-triggered (workflow_dispatch) job in the consumer repo —
# never wire it to config deletion.
name: destroy-occasion

on:
  workflow_call:
    inputs:
      occasion_dir:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: us-east-1
      partyplanner_ref:
        required: false
        type: string
        default: default
      role_to_assume:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install partyplanner
        run: >
          uv tool install
          "partyplanner[aws] @ git+https://github.com/duplico/partyplanner@${{ inputs.partyplanner_ref }}"

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Export final RSVP snapshot
        run: |
          terraform -chdir="${{ inputs.occasion_dir }}/terraform" init -input=false
          table="$(terraform -chdir="${{ inputs.occasion_dir }}/terraform" output -raw table_name)"
          partyplanner export-rsvps --table "$table" > rsvps-final.csv

      - name: Upload RSVP snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rsvps-final-${{ github.run_number }}
          path: rsvps-final.csv
          retention-days: 90

      - name: Terraform destroy
        run: terraform -chdir="${{ inputs.occasion_dir }}/terraform" destroy -input=false -auto-approve
